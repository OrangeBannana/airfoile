<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Airfoile</title>
<meta name="description" content="Guess the NACA 4-digit airfoil from its shape.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M4 52C20 30 60 34 96 50C60 56 20 62 4 52Z'/%3E%3C/svg%3E">
<style>
:root{--fg:#111;--bg:#fff;--mid:#8a8a8a;--soft:#e2e2e2}
@media (prefers-color-scheme:dark){:root{--fg:#eaeaea;--bg:#111;--mid:#7a7a7a;--soft:#2c2c2c}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg)}
body{font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;-webkit-tap-highlight-color:transparent}
main{max-width:400px;margin:0 auto;padding:28px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:22px}
header{width:100%;display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
h1{font-size:13px;font-weight:400;letter-spacing:.35em}
a{color:var(--mid);text-decoration:none}
#help{width:100%;font-size:12px;color:var(--mid)}
svg{width:100%;height:auto;display:block}
.target{fill:var(--fg)}
.guess{fill:none;stroke:var(--mid);stroke-width:2;stroke-dasharray:6 5}
.chord{stroke:var(--soft);stroke-width:1.5}
.rows{display:grid;gap:6px}
.row{display:flex;gap:6px}
.t{width:46px;height:46px;border:1px solid var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;line-height:1}
.t:nth-child(3){margin-left:10px}
.t small{font-size:10px;margin-top:3px;color:var(--mid)}
.t.f{border-color:var(--mid)}
.t.n{border-color:var(--fg)}
.t.c{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#msg{min-height:1.5em;font-size:13px;text-align:center}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%}
button{font:inherit;color:inherit;background:none;border:1px solid var(--soft);height:46px;cursor:pointer;touch-action:manipulation}
button:active{background:var(--soft)}
.w2{grid-column:span 2}.w3{grid-column:span 3}
.end{display:none;gap:16px;font-size:13px}
.end.on{display:flex}
.end button{height:auto;border:none;padding:0;color:var(--mid)}
</style>
</head>
<body>
<main>
<header><h1>AIRFOILE</h1><span><span id="no"></span> &nbsp;<a href="#" id="q">?</a></span></header>
<p id="help" hidden>Guess the NACA 4-digit airfoil in 4 tries.<br><br>
MPXX — M: max camber (% chord) · P: camber position (tenths of chord) · XX: thickness (% chord). Symmetric sections are 00XX.<br><br>
■ right digit · bold border: off by one · ↑↓ go higher / lower. Your last guess is drawn dashed.</p>
<svg viewBox="-30 -200 1060 320" aria-label="target airfoil"><line class="chord" x1="0" y1="0" x2="1000" y2="0"/><path id="tp" class="target"/><path id="gp" class="guess"/></svg>
<div class="rows" id="rows"></div>
<div id="msg"></div>
<div class="end" id="end"><button id="share">share</button><button id="again">practice</button></div>
<div class="keys" id="keys"></div>
</main>
<script>
(()=>{
const TRIES=4, EPOCH=Date.UTC(2026,10,12);
const $=id=>document.getElementById(id);

// --- NACA 4-digit geometry ---
function foil(m,p,t,n=90){
  m/=100;p/=10;t/=100;const up=[],lo=[];
  for(let i=0;i<=n;i++){
    const x=(1-Math.cos(Math.PI*i/n))/2;
    const yt=5*t*(.2969*Math.sqrt(x)-.126*x-.3516*x*x+.2843*x**3-.1036*x**4);
    let yc=0,dy=0;
    if(m>0){if(x<p){yc=m/p/p*(2*p*x-x*x);dy=2*m/p/p*(p-x)}
            else{yc=m/(1-p)**2*(1-2*p+2*p*x-x*x);dy=2*m/(1-p)**2*(p-x)}}
    const a=Math.atan(dy),s=Math.sin(a),c=Math.cos(a);
    up.push([x-yt*s,yc+yt*c]);lo.push([x+yt*s,yc-yt*c]);
  }
  const pts=up.reverse().concat(lo.slice(1));
  return 'M'+pts.map(([x,y])=>(x*1e3).toFixed(1)+','+(-y*1e3).toFixed(1)).join('L')+'Z';
}
const parse=s=>[+s[0],+s[1],+s.slice(2)];

// --- puzzle selection ---
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pool=[];
for(let t=6;t<=24;t++){for(let k=0;k<3;k++)pool.push([0,0,t]);for(let m=1;m<=6;m++)for(let p=2;p<=6;p++)pool.push([m,p,t]);}
const r=rng(20261112);
for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
const code=([m,p,t])=>`${m}${p}${String(t).padStart(2,'0')}`;

const now=new Date();
const day=Math.max(1,Math.floor((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-EPOCH)/864e5)+1);
let practice=false, answer, key, S;

function start(prac){
  practice=prac;
  answer=prac?code(pool[Math.floor(Math.random()*pool.length)]):code(pool[(day-1)%pool.length]);
  key='airfoile-'+day;
  S={g:[],cur:''};
  if(!prac){try{const s=JSON.parse(localStorage.getItem(key));if(s&&Array.isArray(s.g))S={g:s.g,cur:''}}catch(e){}}
  $('no').textContent=prac?'practice':'#'+day;
  $('tp').setAttribute('d',foil(...parse(answer)));
  $('msg').textContent='';
  render();
}
function save(){if(!practice)try{localStorage.setItem(key,JSON.stringify({g:S.g}))}catch(e){}}

function score(g){
  return [...g].map((d,i)=>{const a=+answer[i],b=+d;
    return a===b?{k:'c'}:{k:Math.abs(a-b)===1?'n':'',a:b<a?'↑':'↓'}});
}
const won=()=>S.g.includes(answer);
const over=()=>won()||S.g.length>=TRIES;

function render(){
  const rows=$('rows');rows.innerHTML='';
  for(let i=0;i<TRIES;i++){
    const row=document.createElement('div');row.className='row';
    const g=S.g[i], sc=g&&score(g), live=i===S.g.length&&!over();
    for(let j=0;j<4;j++){
      const t=document.createElement('div');t.className='t';
      if(g){t.classList.add('f');if(sc[j].k)t.classList.add(sc[j].k);t.innerHTML=g[j]+(sc[j].a?`<small>${sc[j].a}</small>`:'')}
      else if(live&&S.cur[j]!==undefined){t.classList.add('f');t.textContent=S.cur[j]}
      row.appendChild(t);
    }
    rows.appendChild(row);
  }
  const last=S.g[S.g.length-1];
  $('gp').setAttribute('d',last&&last!==answer?foil(...parse(last)):'');
  if(over()){
    $('msg').textContent=won()?`NACA ${answer} · ${S.g.length}/${TRIES}`:`NACA ${answer}`;
    $('end').classList.add('on');$('keys').style.visibility='hidden';
  }else{$('end').classList.remove('on');$('keys').style.visibility=''}
}

function flash(t){$('msg').textContent=t;clearTimeout(flash.h);flash.h=setTimeout(()=>{if(!over())$('msg').textContent=''},1800)}

function press(k){
  if(over())return;
  if(/^\d$/.test(k)&&S.cur.length<4)S.cur+=k;
  else if(k==='del')S.cur=S.cur.slice(0,-1);
  else if(k==='enter'){
    if(S.cur.length<4)return flash('four digits');
    const [m,p,t]=parse(S.cur);
    if(t<1)return flash('thickness must be > 0');
    if(m>0&&p===0)return flash('cambered foils need P > 0');
    if(m===0&&p>0)return flash('symmetric foils are 00XX');
    S.g.push(S.cur);S.cur='';save();
  }
  render();
}

// keypad
const keys=$('keys');
['1','2','3','4','5','6','7','8','9','0'].forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>press(k);keys.appendChild(b)});
[['del','⌫','w2'],['enter','enter','w3']].forEach(([k,l,c])=>{const b=document.createElement('button');b.textContent=l;b.className=c;b.onclick=()=>press(k);keys.appendChild(b)});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(/^\d$/.test(e.key))press(e.key);
  else if(e.key==='Backspace')press('del');
  else if(e.key==='Enter'){e.preventDefault();press('enter')}
});

$('share').onclick=()=>{
  const grid=S.g.map(g=>score(g).map(s=>s.k==='c'?'🟩':s.a==='↑'?'⬆️':'⬇️').join('')).join('\n');
  const txt=`Airfoile ${practice?'practice':'#'+day} ${won()?S.g.length:'X'}/${TRIES}\n${grid}\n${location.origin+location.pathname}`;
  const done=()=>flash('copied');
  if(navigator.share&&matchMedia('(pointer:coarse)').matches)navigator.share({text:txt}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(done,()=>prompt('copy',txt));
  else prompt('copy',txt);
};
$('again').onclick=()=>start(true);
$('q').onclick=e=>{e.preventDefault();$('help').hidden=!$('help').hidden};

start(false);
})();
</script>
</body>
</html>
